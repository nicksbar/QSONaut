[package]
name = "qsonaut"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true

qsonaut-audio = { path = "../../crates/qsonaut-audio" }
qsonaut-hostbridge-client = { path = "../../crates/qsonaut-hostbridge-client" }
qsonaut-core = { path = "../../crates/qsonaut-core" }
qsonaut-log = { path = "../../crates/qsonaut-log" }
qsonaut-radio = { package = "rigwright", git = "https://github.com/nicksbar/rigwright.git", rev = "6a480c8d3de3dd914ce9ac9ac995acb5d999a5fa", version = "0.1.21" }
qsonaut-gui = { path = "../../crates/qsonaut-gui" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
winresource = "0.1"
