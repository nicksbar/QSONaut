name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04

    steps:
      # The application consumes modem libraries as sibling workspaces.
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      - name: Check out mfsk-core
        uses: actions/checkout@v6
        with:
          repository: jl1nie/mfsk-core
          # Pin the integration dependency to the exact tested upstream commit.
          ref: bfcac2c93bf3add38f1214a809705e9838cac9c3
          path: mfsk-core

      - name: Check out DitDah
        uses: actions/checkout@v6
        with:
          repository: yuvadm/ditdah
          ref: main
          path: ditdah

      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        working-directory: QSONaut
        run: cargo fmt -- --check

      - name: Build workspace
        working-directory: QSONaut
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        working-directory: QSONaut
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        working-directory: QSONaut
        run: cargo test --workspace --all-targets
