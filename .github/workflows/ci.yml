name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-fixtures:
    name: Deterministic fixture suites
    runs-on: ubuntu-24.04

    steps:
      - name: Check out QSONaut
        uses: actions/checkout@v6

      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust components
        run: rustup component add rustfmt

      - name: Run core, logging, and GUI fixture suites
        run: |
          cargo test --locked -p qsonaut-core --lib
          cargo test --locked -p qsonaut-log --lib
          cargo test --locked -p qsonaut-gui --lib

  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04

    steps:
      # Shared modem dependencies are resolved from pinned upstream Git revisions.
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      # Rigwright and shared components are resolved from immutable Git revisions.

      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        working-directory: QSONaut
        run: cargo fmt -- --check

      - name: Build workspace
        working-directory: QSONaut
        run: cargo check --locked --workspace --all-targets

      - name: Lint workspace
        working-directory: QSONaut
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        working-directory: QSONaut
        run: cargo test --locked --workspace --all-targets
