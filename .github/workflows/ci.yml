name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04

    steps:
      # cw-dit and mfsk-core are resolved from pinned upstream Git dependencies.
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      # Rigwright is resolved from crates.io by the Cargo manifests.

      - name: Install Linux native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        working-directory: QSONaut
        run: cargo fmt -- --check

      - name: Build workspace
        working-directory: QSONaut
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        working-directory: QSONaut
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        working-directory: QSONaut
        run: cargo test --workspace --all-targets
