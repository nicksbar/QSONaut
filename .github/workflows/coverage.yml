name: Coverage

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  llvm:
    name: Tests and LLVM coverage
    runs-on: ubuntu-24.04
    env:
      # Rendering-only, UI-callback, and hardware-dependent paths are reported separately;
      # the gate covers executable application, HAL, worker, and contract code.
      QSONAUT_COVERAGE_IGNORE_REGEX: crates/qsonaut-gui/src/panels/(devices|profile_server|radio_ui)\.rs|crates/qsonaut-gui/src/modes/(sstv|ft8|ft4|voice|jt9|jt65|q65|wspr|fst4)\.rs
    steps:
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install native and LLVM dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev llvm

      - name: Install Rust coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Run the complete test suite
        run: cargo test --locked --workspace --all-targets

      - name: Enforce workspace coverage baseline
        run: |
          set -o pipefail
          cargo llvm-cov --locked --all-features --workspace --ignore-filename-regex "$QSONAUT_COVERAGE_IGNORE_REGEX" --summary-only | tee coverage-summary.txt
          bash scripts/check-coverage.sh coverage-summary.txt 60 80
          bash scripts/check-cw-coverage.sh coverage-summary.txt 80

      - name: Enforce changed-file coverage
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-changed-coverage.sh coverage-summary.txt

      - name: Generate HTML coverage report
        if: always()
        run: cargo llvm-cov --locked --all-features --workspace --ignore-filename-regex "$QSONAUT_COVERAGE_IGNORE_REGEX" --html --output-dir target/llvm-cov

      - name: Publish test and coverage summary
        if: always()
        run: |
          {
            echo '## Test and LLVM coverage'
            echo
            echo 'The complete test suite and HTML coverage report are available in the workflow artifacts.'
            echo
            echo '### Coverage summary'
            echo
            if [[ -f coverage-summary.txt ]]; then
              cat coverage-summary.txt
              echo
              bash scripts/check-coverage.sh coverage-summary.txt 60 80
            else
              echo 'Coverage summary was not generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qsonaut-llvm-coverage
          path: target/llvm-cov/html
          if-no-files-found: error
