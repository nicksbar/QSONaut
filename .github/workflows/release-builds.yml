name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: qsonaut-linux-x86_64
            os: linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: qsonaut-linux-arm64
            os: linux
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: qsonaut-windows-x86_64
            os: windows
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: qsonaut-windows-arm64
            os: windows

    steps:
      # The application currently consumes mfsk-core as a sibling workspace.
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      - name: Check out mfsk-core
        uses: actions/checkout@v6
        with:
          repository: jl1nie/mfsk-core
          # Post-v0.9.1: includes QSONaut's merged FT8 lag-bounds fix
          # (#279) and upstream's fixed-window/candidate follow-ups (#281).
          ref: ff9a04119cb8580ede6f2c943afdeee08e81777e
          path: mfsk-core

      - name: Install Linux native libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        working-directory: QSONaut
        run: cargo build --release --target ${{ matrix.target }} -p qsonaut

      - name: Package Linux distribution
        if: matrix.os == 'linux'
        working-directory: QSONaut
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/qsonaut" "dist/${{ matrix.artifact }}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md qsonaut.toml.example "dist/${{ matrix.artifact }}/"
          cp ../mfsk-core/LICENSE "dist/${{ matrix.artifact }}/MFSK-CORE-LICENSE.txt"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package Windows distribution
        if: matrix.os == 'windows'
        working-directory: QSONaut
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/${{ matrix.artifact }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/qsonaut.exe" "dist/${{ matrix.artifact }}/"
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md,qsonaut.toml.example "dist/${{ matrix.artifact }}/"
          Copy-Item ../mfsk-core/LICENSE "dist/${{ matrix.artifact }}/MFSK-CORE-LICENSE.txt"
          Compress-Archive -Path "dist/${{ matrix.artifact }}/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: QSONaut/dist/${{ matrix.artifact }}.*
          if-no-files-found: error
