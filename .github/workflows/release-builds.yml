name: Release builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      - name: Verify SemVer tag and workspace version
        working-directory: QSONaut
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not SemVer (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qsonaut") | .version')"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: [verify-tag]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: qsonaut-linux-x86_64
            os: linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: qsonaut-linux-arm64
            os: linux
          - name: Windows x86_64
            runner: ubuntu-24.04
            target: x86_64-pc-windows-gnullvm
            artifact: qsonaut-windows-x86_64
            os: windows
            llvm_target: x86_64
          - name: Windows ARM64
            runner: ubuntu-24.04
            target: aarch64-pc-windows-gnullvm
            artifact: qsonaut-windows-arm64
            os: windows
            llvm_target: aarch64

    steps:
      - name: Check out QSONaut
        uses: actions/checkout@v6
        with:
          path: QSONaut

      - name: Install Linux native libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install LLVM-MinGW cross compiler
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version=20250114
          archive="llvm-mingw-${version}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          curl --fail --location --retry 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          echo "CC=${{ matrix.llvm_target }}-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.llvm_target }}-w64-mingw32-clang++" >> "$GITHUB_ENV"
          target_linker_var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "${target_linker_var}=${{ matrix.llvm_target }}-w64-mingw32-clang" >> "$GITHUB_ENV"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        working-directory: QSONaut
        env:
          QSONAUT_CONTRIBUTORS: ${{ vars.QSONAUT_CONTRIBUTORS }}
          QSONAUT_TESTERS: ${{ vars.QSONAUT_TESTERS }}
          RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p qsonaut

      - name: Verify Windows runtime is statically linked
        if: matrix.os == 'windows'
        working-directory: QSONaut
        shell: bash
        run: |
          set -euo pipefail
          needed_libs="$(objdump -p "target/${{ matrix.target }}/release/qsonaut.exe" | awk '/DLL Name:/ {print $3}')"
          printf '%s\n' "$needed_libs"
          if grep -Eiq '^(libunwind|libgcc_s_seh|libwinpthread)' <<<"$needed_libs"; then
            echo "The Windows executable still has a MinGW runtime DLL dependency."
            exit 1
          fi

      - name: Package Linux distribution
        if: matrix.os == 'linux'
        working-directory: QSONaut
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/qsonaut" "dist/${{ matrix.artifact }}/"
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md qsonaut.toml.example "dist/${{ matrix.artifact }}/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package Windows distribution
        if: matrix.os == 'windows'
        working-directory: QSONaut
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/qsonaut.exe" "dist/${{ matrix.artifact }}/"
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md qsonaut.toml.example "dist/${{ matrix.artifact }}/"
          (cd dist && zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}")

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: QSONaut/dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out QSONaut
        uses: actions/checkout@v6

      - name: Verify SemVer tag and changelog entry
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not SemVer (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          if ! grep -Eq "^## \[$TAG\] - " CHANGELOG.md; then
            echo "CHANGELOG.md is missing section: ## [$TAG] - YYYY-MM-DD"
            exit 1
          fi
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qsonaut") | .version')"
          if [[ "$PACKAGE_VERSION" != "$TAG" ]]; then
            echo "Tag $TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\] - " {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            cat > RELEASE_NOTES.md <<EOF
          Release v${TAG}

          See CHANGELOG.md for details.
          EOF
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          fail_on_unmatched_files: true
