when = [{ match = "field_equals", field = "mode", value = "CW" }]
metric = "event_count"
target = 10

[[achievements]]
id = "early-bird"
title = "Early Bird"
detail = "Log a QSO before 07:00 UTC"
on = "qso_logged"
when = [{ match = "has_tag", tag = "early_bird" }]
