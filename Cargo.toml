[workspace]
members = [
    "apps/rigforge",
    "crates/rigforge-core",
    "crates/rigforge-audio",
    "crates/rigforge-dsp",
    "crates/rigforge-radio",
    "crates/rigforge-modes",
    "crates/rigforge-log",
    "crates/rigforge-ai",
    "crates/rigforge-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RigForge Contributors"]

[workspace.dependencies]
dotenvy = "0.15"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland"] }
rustfft = "6"

[profile.dev.package."mfsk-core"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package."rigforge-dsp"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package."rigforge-modes"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
