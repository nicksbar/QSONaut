[workspace]
members = [
    "apps/qsonaut",
    "crates/qsonaut-core",
    "crates/qsonaut-audio",
    "crates/qsonaut-log",
    "crates/qsonaut-accelerate",
    "crates/qsonaut-automation",
    "crates/qsonaut-pskreporter",
    "crates/qsonaut-server-client",
    "crates/qsonaut-gui",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "persistence"] }
rustfft = "6"
cpal = "0.15"
wgpu = { version = "27", default-features = false, features = ["std", "vulkan"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev.package."mfsk-core"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
