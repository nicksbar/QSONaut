[workspace]
members = [
    "apps/qsonaut",
    "crates/qsonaut-core",
    "crates/qsonaut-audio",
    "crates/qsonaut-dsp",
    "crates/qsonaut-radio",
    "crates/qsonaut-modes",
    "crates/qsonaut-log",
    "crates/qsonaut-ai",
    "crates/qsonaut-accelerate",
    "crates/qsonaut-automation",
    "crates/qsonaut-pskreporter",
    "crates/qsonaut-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
dotenvy = "0.15"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland"] }
rustfft = "6"
cpal = "0.15"
wgpu = { version = "27", default-features = false, features = ["std", "vulkan"] }

[profile.dev.package."mfsk-core"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package."qsonaut-dsp"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package."qsonaut-modes"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
