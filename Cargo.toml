[workspace]
members = [
    "apps/qsonaut",
    "crates/qsonaut-core",
    "crates/qsonaut-audio",
    "crates/qsonaut-log",
    "crates/qsonaut-accelerate",
    "crates/qsonaut-automation",
    "crates/qsonaut-pskreporter",
    "crates/qsonaut-server-client",
    "crates/qsonaut-hostbridge-client",
    "crates/qsonaut-gui",
]
resolver = "2"

# Keep the in-flight local rigwright checkout authoritative for both direct
# dependencies and the remote qsonaut-hostbridge-protocol dependency.
[patch."https://github.com/nicksbar/rigwright.git"]
rigwright = { path = "../rigwright" }

# Keep the GUI and application debuggable, but do not run the modem DSP in
# unoptimized debug code. FST4/Q65 operate on large 12 kHz slot buffers and
# their debug-build cost can make the GUI appear frozen while decoding.
[profile.dev.package.mfsk-core]
opt-level = 2

[profile.dev.package.qsonaut-third-party]
opt-level = 2

[profile.dev.package.qsonaut-modems]
opt-level = 2

# Opt in to fully unoptimized modem code when stepping through the lower-level
# DSP implementation. This is deliberately separate from the normal dev
# profile so application/UI debugging remains fast enough for daily use.
[profile.modem-debug]
inherits = "dev"

[profile.modem-debug.package.mfsk-core]
opt-level = 0

[profile.modem-debug.package.qsonaut-third-party]
opt-level = 0

[profile.modem-debug.package.qsonaut-modems]
opt-level = 0

[workspace.package]
version = "0.3.15"
edition = "2021"
license = "MIT"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
# Keep rendering on wgpu with Vulkan, GLES, and Metal available as appropriate
# for the host. DX12 is intentionally omitted for now: wgpu 27's DX12 allocator
# requires Windows bindings that conflict with cpal 0.15's Windows bindings.
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }
rustfft = "6"
cpal = "0.15"
futures-util = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
