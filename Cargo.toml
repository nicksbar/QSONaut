[workspace]
members = [
    "apps/qsonaut",
    "crates/qsonaut-core",
    "crates/qsonaut-audio",
    "crates/qsonaut-log",
    "crates/qsonaut-accelerate",
    "crates/qsonaut-automation",
    "crates/qsonaut-pskreporter",
    "crates/qsonaut-server-client",
    "crates/qsonaut-sstv",
    "crates/qsonaut-gui",
]
resolver = "2"

[workspace.package]
version = "0.3.9"
edition = "2021"
license = "MIT"
authors = ["QSONaut Contributors"]

[workspace.dependencies]
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
# Native modern backends only: Vulkan (Linux/WSL), DX12 (Windows), Metal
# (macOS). Keeping GLES disabled removes the legacy glow dependency entirely.
# Keep rendering on wgpu while also compiling its OpenGL backend. WSLg often
# exposes hardware acceleration through Mesa's D3D12 OpenGL path even when
# its Vulkan ICD falls back to llvmpipe.
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "gles", "dx12", "metal", "wgsl"] }
rustfft = "6"
cpal = "0.15"
futures-util = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.dev.package."mfsk-core"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
